name: Validate practice app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check guitar.js
          node --check phrase.js
      - name: Validate lesson and phrase data
        run: npm test
      - name: Check integrated pages
        run: |
          test -f index.html
          test -f phrase.html
          test -f rhythm.html
          test -f data/phrases.json
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install chromium
      - name: Mobile browser smoke test
        run: |
          python3 -m http.server 4173 > /tmp/practice-http.log 2>&1 &
          npx playwright test tests/smoke.spec.mjs --reporter=line
