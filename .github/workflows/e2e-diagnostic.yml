name: E2E diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser test runtime
        run: npm install --no-package-lock
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Capture E2E output
        run: |
          set +e
          npm run test:e2e > e2e-diagnostic.txt 2>&1
          status=$?
          cat e2e-diagnostic.txt
          printf '%s\n' "$status" > e2e-exit-code.txt
          exit 0
      - name: Upload E2E diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostic
          path: |
            e2e-diagnostic.txt
            e2e-exit-code.txt
