name: Apply Phase 3 recorder fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/recording-self-monitoring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recording-self-monitoring
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: node scripts/apply-phase3-recorder-fix.mjs
      - name: Validate syntax and unit tests
        run: |
          node --check guitar.js
          node --check phrase.js
          node --check rhythm.js
          node --check sw.js
          find core rhythm -type f -name '*.js' -exec node --check {} \;
          npm test
          git diff --check
      - name: Commit fixes and remove temporary diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix recording lifecycle and storage error regression"
          git push origin HEAD:feat/recording-self-monitoring
