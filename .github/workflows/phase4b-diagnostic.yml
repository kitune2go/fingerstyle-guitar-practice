name: Diagnose Phase 4B calibration E2E

on:
  push:
    branches:
      - automation/phase4b-implementation

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/measurement-semantics-calibration
      - name: Verify expected target head
        run: test "$(git rev-parse HEAD)" = "7f2c39e327b056f4236e3470fc2b7aa6d3dc1f9a"
      - name: Checkout implementation helper
        uses: actions/checkout@v4
        with:
          ref: automation/phase4b-implementation
          path: _phase4b_helper
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Phase 4B implementation
        run: |
          bash _phase4b_helper/scripts/apply-phase4b.sh
          bash _phase4b_helper/scripts/patch-phase4b-stability.sh
          rm -rf _phase4b_helper
      - name: Install browser test runtime
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run calibration suite sequentially
        shell: bash
        run: |
          set +e
          npx playwright test tests/calibration.spec.mjs --reporter=line --workers=1 > /tmp/calibration.txt 2>&1
          status=$?
          tail -n 160 /tmp/calibration.txt
          exit $status
      - name: Run rhythm focus regression sequentially
        shell: bash
        run: |
          set +e
          npx playwright test tests/focus.spec.mjs --grep "rhythm focus schedules" --reporter=line --workers=1 > /tmp/rhythm.txt 2>&1
          status=$?
          tail -n 160 /tmp/rhythm.txt
          exit $status
      - name: Run full suite sequentially
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=line --workers=1 > /tmp/full.txt 2>&1
          status=$?
          tail -n 220 /tmp/full.txt
          exit $status
