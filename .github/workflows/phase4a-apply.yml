name: Bootstrap Phase 4B roadmap

on:
  push:
    branches:
      - automation/phase4a-bootstrap

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4B branch
        uses: actions/checkout@v4
        with:
          ref: feat/measurement-semantics-calibration
          fetch-depth: 0
      - name: Verify branch starts from merged Phase 4A main
        run: |
          test "$(git rev-parse HEAD)" = "10874ffe9f66c5f0dccef76d29ee64f02b5a1871"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "10874ffe9f66c5f0dccef76d29ee64f02b5a1871"
      - name: Update ROADMAP only
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/ROADMAP.md")
          text = path.read_text()
          replacements = {
              "**CURRENT SUBPHASE: Phase 4A — 診断focusモデル**": "**CURRENT SUBPHASE: Phase 4B — 測定意味論とレイテンシ校正**",
              "**NEXT SUBPHASE: Phase 4B — 測定意味論とレイテンシ校正**": "**NEXT SUBPHASE: Phase 4C — 処方**",
              "現在は `docs/TASK-NEXT-DIAGNOSTIC-FOCUS.md` を正として Phase 4A を実装します。": "Phase 4A — 診断focusモデルは PR #14 の `main` マージにより完了しました。\n現在は Phase 4B — 測定意味論とレイテンシ校正です。",
              "**状態: CURRENT — Phase 4A**": "**状態: CURRENT — Phase 4B**",
              "**Phase 4B — 測定意味論と校正**": "**Phase 4B — 測定意味論とレイテンシ校正**",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one ROADMAP match for {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
      - name: Verify first Phase 4B commit changes ROADMAP only
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/ROADMAP.md"
      - name: Commit Phase 4B roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Start Phase 4B measurement semantics and calibration"
          git push origin HEAD:feat/measurement-semantics-calibration
