name: Validate Phase 4A focus semantics fix

on:
  push:
    branches:
      - automation/phase4a-bootstrap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/diagnostic-practice-focus
          fetch-depth: 0
      - name: Verify expected target head
        run: |
          test "$(git rev-parse HEAD)" = "19b0228afa5223b88a785e97dc2fc5629348fa7d"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: automation/phase4a-bootstrap
          path: _phase4a_helper
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focus semantics fix
        run: |
          node _phase4a_helper/scripts/patch-phase4a-focus-semantics.mjs
          rm -rf _phase4a_helper
      - name: Check JavaScript syntax
        run: |
          node --check guitar.js
          node --check phrase.js
          node --check rhythm.js
          node --check sw.js
          find core rhythm -type f -name '*.js' -exec node --check {} \;
      - name: Run unit and data validation
        run: npm test
      - name: Check patch whitespace
        run: git diff --check
      - name: Install browser test runtime
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Commit validated focus semantics fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/practice.js phrase.js phrase.html sw.js docs/TASK-NEXT-DIAGNOSTIC-FOCUS.md tests/unit/practice-focus.test.mjs tests/focus.spec.mjs
          git diff --cached --check
          git commit -m "Fix focus-specific self-evaluation semantics"
          git push origin HEAD:feat/diagnostic-practice-focus
